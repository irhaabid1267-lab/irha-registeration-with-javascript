<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <div class="register-card mx-auto">

            <div class="form-heading">
                <div class="icon-box">🎓</div>
                <h2>Create Account</h2>
                <p>Register now and start your learning journey!</p>
            </div>

            <div id="message" class="alert d-none" role="alert"></div>

            <form id="registrationForm" novalidate>
                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label for="name" class="form-label">Full Name</label>
                        <input type="text" id="name" class="form-control" placeholder="Enter your name">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="email" class="form-label">Email Address</label>
                        <input type="email" id="email" class="form-control" placeholder="example@email.com">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="phone" class="form-label">Phone Number</label>
                        <input type="tel" id="phone" class="form-control" placeholder="03XXXXXXXXX">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="course" class="form-label">Select Course</label>
                        <select id="course" class="form-select">
                            <option value="">Choose a course</option>
                            <option value="Web Development">Web Development</option>
                            <option value="Graphic Designing">Graphic Designing</option>
                            <option value="Computer Science">Computer Science</option>
                            <option value="Digital Marketing">Digital Marketing</option>
                            <option value="Python Programming">Python Programming</option>
                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" id="password" class="form-control" placeholder="Minimum 8 characters">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="confirmPassword" class="form-label">
                            Confirm Password
                        </label>
                        <input type="password" id="confirmPassword" class="form-control"
                            placeholder="Enter password again">
                    </div>

                </div>

                <button type="submit" class="btn register-btn w-100 mt-2">
                    Create Account →
                </button>
            </form>

            <p class="bottom-text">© 2026 Student Registration Portal</p>

        </div>
    </div>

    <!-- JavaScript -->
    <script src="script.js"></script>
</body>

</html>
